[project]
name = "pr-review-agent"
version = "0.1.0"
description = "AI-powered PR review agent that reads GitHub PRs, analyzes changes with an LLM, and leaves real review comments or assigns human reviewers"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "instructor>=1.7.0",
    "PyJWT[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pyright>=1.1",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
